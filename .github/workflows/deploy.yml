name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ログインが必須なので、設定が無いまま API と Web を入れ替えない
      - name: Check login settings
        if: ${{ vars.VITE_FIREBASE_API_KEY == '' || vars.VITE_FIREBASE_PROJECT_ID == '' || vars.VITE_FIREBASE_AUTH_DOMAIN == '' }}
        run: |
          echo "::error::Actions の変数 VITE_FIREBASE_API_KEY / VITE_FIREBASE_AUTH_DOMAIN / VITE_FIREBASE_PROJECT_ID を設定してください(docs/deploy.md)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: evc-api
          region: ${{ env.REGION }}
          source: .
          flags: >-
            --allow-unauthenticated
            --max-instances=3
            --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,GITHUB_TOKEN=github-token:latest
          env_vars: |
            STORE=firestore
            GEMINI_MODEL=gemini-3-flash-preview
            RATE_LIMIT_PER_HOUR=10
            AUTH=firebase
            ALLOWED_GITHUB_IDS=${{ vars.ALLOWED_GITHUB_IDS }}

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # 非公開リポジトリが読めないときに出す、GitHub App のインストールの案内(公開の値)
          VITE_GITHUB_APP_SLUG: evc-escape-vibecoder
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: npx -y firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
